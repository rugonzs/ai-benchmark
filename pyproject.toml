[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-benchmark"
version = "0.1.0"
description = "Minimal benchmark for BERT NER vs LFM2 fine-tuning vs Qwen prompting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.4.0",
  "datasets>=3.6.0",
  "numpy>=1.26.0",
  "ollama>=0.5.4",
  "peft>=0.17.0",
  "psutil>=7.0.0",
  "pydantic>=2.5.3",
  "PyYAML>=6.0.2",
  "requests>=2.32.0",
  "scikit-learn>=1.4.0",
  "seqeval>=1.2.2",
  "sentencepiece>=0.2.0",
  "torch>=2.6.0",
  "transformers>=4.55.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
